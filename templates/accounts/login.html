{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <!-- Login Icon -->

        <div class="login-logo">

            <i class="bi bi-person-circle"></i>

        </div>

        <!-- Heading -->

        <h2>

            Welcome Back

        </h2>

        <p>

            Sign in to continue to Freelancer Marketplace

        </p>

        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required>

            </div>

            <!-- Password -->

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>

            <!-- Login Button -->

            <button
                type="submit"
                class="btn btn-primary">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <!-- Register Link -->

        <div class="login-divider">

            Don't have an account?

        </div>

        <div class="text-center">

            <a href="{% url 'register' %}"
               class="btn btn-outline-primary">

                <i class="bi bi-person-plus"></i>

                Create Account

            </a>

        </div>

    </div>

</div>

{% endblock %}

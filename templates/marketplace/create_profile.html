{% extends "base.html" %}

{% block title %}
Complete Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="project-form-card mx-auto" style="max-width:800px;">

        <div class="project-header text-center">

            <i class="bi bi-person-circle display-3"></i>

            <h2 class="mt-3">
                Complete Your Freelancer Profile
            </h2>

            <p>
                Fill in your professional details to start freelancing.
            </p>

        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="d-grid mt-4">

                <button
                    type="submit"
                    class="btn btn-primary btn-lg">

                    Save Profile

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

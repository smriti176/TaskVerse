{% extends 'base.html' %}

{% block title %}
Delete Project
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h2>Delete Project</h2>

<hr>

<h4>{{ project.title }}</h4>

<p>
Are you sure you want to delete this project?
</p>

<form method="POST">

{% csrf_token %}

<button class="btn btn-danger">
Delete
</button>

<a href="{% url 'my_projects' %}" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Leave Review
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2>Leave a Review</h2>

            <hr>

            <h5>
                Project:
                {{ project.title }}
            </h5>

            <br>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Rating
                    </label>

                    {{ form.rating }}

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Review
                    </label>

                    {{ form.comment }}

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Submit Review

                </button>

                <a href="{% url 'project_detail' project.id %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
